name: Keep booking times warm

# The booking page's available times come from the appointment-booking function, which asks a
# Google Apps Script calendar. After a quiet spell the first request can take over 10 seconds.
# Calling it every 10 minutes between 07:00 and 22:00 UK time keeps the first visitor's load
# at about 2 seconds. Uses only the public Supabase URL and anon key (repository variables).

on:
  schedule:
    # Every 10 minutes, 06:00-22:59 UTC: covers 07:00-22:00 UK time in both GMT and BST.
    - cron: "*/10 6-22 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: warm-booking
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Only between 07:00 and 22:00 UK time
        id: hours
        run: |
          hour=$(TZ=Europe/London date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$hour" -ge 7 ] && [ "$hour" -lt 22 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside 07:00-22:00 UK time (now ${hour}:xx); nothing to do."
          fi

      - name: Ask for available times
        if: steps.hours.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          result=$(curl -sS --max-time 60 -o response.json -w "%{http_code} %{time_total}" \
            -X POST "$SUPABASE_URL/functions/v1/appointment-booking" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "apikey: $SUPABASE_ANON_KEY" \
            -d '{"action":"availability"}') || result="000 timeout"
          set -- $result
          slots=$(grep -o '"slots":\[[^]]*\]' response.json 2>/dev/null | grep -o 'T[0-9]' | wc -l)
          echo "HTTP $1 in $2 s, $slots times"
          # A slow or failed warm-up is worth seeing but must not spam failure emails.
          if [ "$1" != "200" ] || ! grep -q '"ok":true' response.json; then
            echo "::warning::Availability check returned HTTP $1"
          fi
